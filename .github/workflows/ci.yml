name: ci

on: 
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.0"
    
    - name: Run tests
      run: go test ./... -cover
    
    - name: Installing gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest
    
    - name: running gosec
      run: gosec ./...
  
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.0"
    
    - name: Run Formatting tests
      run: test -z $(go fmt ./...)

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest
    
    - name: Run Linting tests
      run: staticcheck ./...
    
